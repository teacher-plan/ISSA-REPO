<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Placeholder app icon. Drawn as flat shapes with no text elements so it
    stays legible at 96px, where a glyph would collapse into a smudge.
    Replace wholesale when the real brand mark exists, then re-run
    `npm run generate-icons`.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- loyalty card -->
  <rect x="86" y="146" width="340" height="220" rx="28" fill="url(#card)"/>

  <!-- gloss -->
  <path d="M86 214 L426 146 v44 L86 258 Z" fill="#ffffff" opacity="0.14"/>

  <!-- star, fully inside the card -->
  <path
    d="M256 196 l19 47 51 4 -39 33 12 50 -43 -27 -43 27 12 -50 -39 -33 51 -4 Z"
    fill="#ffffff" opacity="0.95"/>

  <!-- stamp row: three collected, two empty — reads as "progress" -->
  <circle cx="176" cy="326" r="15" fill="#ffffff" opacity="0.95"/>
  <circle cx="216" cy="326" r="15" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="326" r="15" fill="#ffffff" opacity="0.95"/>
  <circle cx="296" cy="326" r="15" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55"/>
  <circle cx="336" cy="326" r="15" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.55"/>

  <!-- phone-ish base bar, hints "digital wallet" -->
  <rect x="196" y="404" width="120" height="14" rx="7" fill="#f59e0b" opacity="0.85"/>
</svg>
