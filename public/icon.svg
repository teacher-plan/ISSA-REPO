<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad1)" rx="100"/>

  <!-- Card shape (loyalty card) -->
  <rect x="80" y="120" width="352" height="272" fill="url(#grad2)" rx="24"/>

  <!-- Card shine effect -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="white" opacity="0.15"/>

  <!-- Points circle -->
  <circle cx="256" cy="320" r="60" fill="white" opacity="0.95"/>
  <text x="256" y="335" font-size="48" font-weight="700" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif">✓</text>

  <!-- Star accent -->
  <polygon points="256,100 268,140 310,140 280,170 292,210 256,180 220,210 232,170 202,140 244,140" fill="white" opacity="0.9"/>

  <!-- Subtitle points -->
  <circle cx="150" cy="420" r="16" fill="#f59e0b" opacity="0.7"/>
  <circle cx="256" cy="435" r="16" fill="#f59e0b" opacity="0.7"/>
  <circle cx="362" cy="420" r="16" fill="#f59e0b" opacity="0.7"/>
</svg>
